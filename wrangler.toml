# Used only when the site was created with the "Workers" deploy target.
# The name is overridden at deploy time via `wrangler deploy --name <repo-name>`
# by .github/workflows/deploy.yml. Pages-target sites ignore this file
# (it has no pages_build_output_dir).
name = "generic-website"
main = "worker/index.js"
compatibility_date = "2026-07-01"
# Disabled: the site lives at the custom domain tax-helper.gcameron.com,
# behind Cloudflare Access. The workers.dev URL would be a second, unrelated
# entry point to the same Worker not covered by that Access application.
workers_dev = false

[observability]
enabled = true

[assets]
directory = "."
binding = "ASSETS"

# Phase 2 storage. See worker/index.js for the fetch handler that uses it.
[[d1_databases]]
binding = "DB"
database_name = "tax-return-helper-db"
database_id = "921a90cd-daa4-4447-ba67-e763e53f78f1"
migrations_dir = "migrations"
